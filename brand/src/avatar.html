<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Ustoz AI avatar</title>
<link rel="stylesheet" href="brand.css">
<style>
  body { --cell: 32px; }
  .mark {
    position: absolute;
    width: 660px; height: 660px;
    /* Optically center the bubble (the sparkle sits up and to the right) */
    left: calc(50% - 330px - 20px); top: calc(50% - 330px + 16px);
    filter: drop-shadow(0 18px 40px rgba(14, 159, 146, 0.45));
  }
</style>
</head>
<body class="grid">
  <img class="mark" src="mark.svg" alt="">
</body>
</html>
